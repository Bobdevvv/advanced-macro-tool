name: Release

# Push a tag like v1.0.0 and this builds AMT.exe on a clean Windows machine,
# runs the full test suite first, and publishes both the exe and its SHA-256
# checksum as a GitHub Release.  The tag must match VERSION in src/brand.py.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write          # needed to create the release

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -r requirements-dev.txt

      - name: Tag matches the app version
        shell: bash
        run: |
          v=$(python -c "from src import brand; print(brand.VERSION)")
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION $v in src/brand.py"
            exit 1
          fi

      - name: Lint
        run: python -m ruff check .

      - name: Tests
        run: python -m unittest discover -s tests -t .

      - name: Build
        run: python -m PyInstaller build.spec --noconfirm --clean

      - name: Checksum
        shell: bash
        run: |
          cd dist
          sha256sum AMT.exe > AMT.exe.sha256
          cat AMT.exe.sha256

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/AMT.exe dist/AMT.exe.sha256 \
            --title "AMT $GITHUB_REF_NAME" \
            --notes-file .github/RELEASE_NOTES.md
